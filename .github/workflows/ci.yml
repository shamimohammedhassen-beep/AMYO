name: AMYO workspace checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible workspace
        run: npm ci --ignore-scripts
      - name: Validate repository boundaries
        run: npm run check
      - name: Build both isolated projects
        run: npm run build
      - name: Run Node tests
        run: npm test
